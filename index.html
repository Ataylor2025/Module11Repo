<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySprint AI | Smart Study Planner</title>
    <meta
      name="description"
      content="A responsive study planner with task management, API-powered inspiration, and interactive focus timer."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>StudySprint AI</h1>
        <p>Plan smarter. Focus deeper. Learn consistently.</p>
      </div>
    </header>

    <main class="container app-grid">
      <section class="card" aria-labelledby="task-title">
        <h2 id="task-title">Study Tasks</h2>
        <form id="task-form" class="row">
          <input id="task-input" type="text" placeholder="Add a study task..." required />
          <select id="priority-input" aria-label="Task priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
          <button type="submit">Add</button>
        </form>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>

      <section class="card" aria-labelledby="timer-title">
        <h2 id="timer-title">Pomodoro Focus Timer</h2>
        <p class="timer" id="timer-display">25:00</p>
        <div class="row">
          <button id="start-timer" type="button">Start</button>
          <button id="pause-timer" type="button">Pause</button>
          <button id="reset-timer" type="button">Reset</button>
        </div>
      </section>

      <section class="card" aria-labelledby="insight-title">
        <h2 id="insight-title">API Learning Insight</h2>
        <p id="quote">Click below to load a motivation quote from an external API.</p>
        <button id="new-quote" type="button">Get New Quote</button>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Built with modern JavaScript, responsive UI patterns, and API integration.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
